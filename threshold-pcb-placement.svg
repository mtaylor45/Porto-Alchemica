<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="660" fill="#fbfaf7"/>

  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">TP-MAIN rev A — Placement, top view</text>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#6b6b6b">70mm dia · 4 layer · scale 6px/mm · connectors face rear</text>

  <!-- board outline -->
  <circle cx="320" cy="310" r="210" fill="#e8f0e6" stroke="#3f6b3a" stroke-width="2.5"/>
  <!-- orientation flat at top -->
  <path d="M 296 128 L 344 128" stroke="#3f6b3a" stroke-width="5" fill="none"/>
  <text x="352" y="124" font-size="11" fill="#3f6b3a">orientation flat (0°)</text>

  <!-- bolt circle -->
  <circle cx="320" cy="310" r="180" fill="none" stroke="#b9b2a4" stroke-width="1" stroke-dasharray="5 5"/>
  <!-- mounting holes at 45/135/225/315 -->
  <g fill="#fbfaf7" stroke="#3f6b3a" stroke-width="2">
    <circle cx="447" cy="183" r="10"/>
    <circle cx="193" cy="183" r="10"/>
    <circle cx="193" cy="437" r="10"/>
    <circle cx="447" cy="437" r="10"/>
  </g>
  <g fill="none" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="3 3">
    <circle cx="447" cy="183" r="18"/>
    <circle cx="193" cy="183" r="18"/>
    <circle cx="193" cy="437" r="18"/>
    <circle cx="447" cy="437" r="18"/>
  </g>
  <text x="462" y="166" font-size="10" fill="#8a8377">M3 ×4, 60mm BCD</text>

  <!-- U1 ESP32 -->
  <rect x="196" y="154" width="108" height="153" rx="3" fill="#d9e2ef" stroke="#3a5480" stroke-width="2"/>
  <text x="250" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#24395e">U1</text>
  <text x="250" y="240" text-anchor="middle" font-size="10.5" fill="#24395e">ESP32-WROOM</text>
  <text x="250" y="254" text-anchor="middle" font-size="10.5" fill="#24395e">-32UE</text>

  <!-- antenna -->
  <rect x="120" y="286" width="30" height="26" rx="3" fill="#f3dcc4" stroke="#9a6b2f" stroke-width="2"/>
  <text x="135" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5223">ANT</text>
  <text x="118" y="332" font-size="10" fill="#9a6b2f">u.FL — route away</text>
  <text x="118" y="345" font-size="10" fill="#9a6b2f">from brass ring</text>

  <!-- U2 buck + L1 -->
  <rect x="356" y="176" width="74" height="54" rx="3" fill="#f6e2e2" stroke="#9c4444" stroke-width="2"/>
  <text x="393" y="199" text-anchor="middle" font-size="12" font-weight="600" fill="#7d3434">U2 · L1</text>
  <text x="393" y="215" text-anchor="middle" font-size="10" fill="#7d3434">3V3 buck</text>

  <!-- C1 -->
  <circle cx="456" cy="268" r="24" fill="#eee9df" stroke="#7a7364" stroke-width="2"/>
  <text x="456" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#57513f">C1</text>
  <text x="456" y="278" text-anchor="middle" font-size="9" fill="#57513f">470µF</text>

  <!-- C7 -->
  <circle cx="176" cy="356" r="26" fill="#eee9df" stroke="#7a7364" stroke-width="2"/>
  <text x="176" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#57513f">C7</text>
  <text x="176" y="366" text-anchor="middle" font-size="9" fill="#57513f">1000µF</text>

  <!-- U3 level shifter -->
  <rect x="228" y="330" width="56" height="26" rx="2" fill="#d9e2ef" stroke="#3a5480" stroke-width="2"/>
  <text x="256" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#24395e">U3 AHCT125</text>

  <!-- U4 amp -->
  <rect x="368" y="330" width="76" height="42" rx="3" fill="#d9e2ef" stroke="#3a5480" stroke-width="2"/>
  <text x="406" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#24395e">U4</text>
  <text x="406" y="363" text-anchor="middle" font-size="9.5" fill="#24395e">MAX98357A</text>

  <!-- buttons -->
  <rect x="318" y="164" width="26" height="24" rx="2" fill="#e5e0d6" stroke="#7a7364" stroke-width="1.5"/>
  <text x="331" y="180" text-anchor="middle" font-size="9" fill="#57513f">SW1</text>
  <rect x="318" y="196" width="26" height="24" rx="2" fill="#e5e0d6" stroke="#7a7364" stroke-width="1.5"/>
  <text x="331" y="212" text-anchor="middle" font-size="9" fill="#57513f">SW2</text>
  <text x="352" y="182" font-size="9.5" fill="#8a8377">BOOT</text>
  <text x="352" y="214" font-size="9.5" fill="#8a8377">EN</text>

  <!-- connector row A -->
  <g stroke="#2f6f63" stroke-width="2" fill="#d6ece7">
    <rect x="180" y="398" width="48" height="26" rx="2"/>
    <rect x="246" y="410" width="62" height="26" rx="2"/>
    <rect x="326" y="398" width="40" height="26" rx="2"/>
  </g>
  <text x="204" y="415" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J2 LED</text>
  <text x="277" y="427" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J3 PN532</text>
  <text x="346" y="415" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J4 SPK</text>

  <!-- connector row B -->
  <g stroke="#2f6f63" stroke-width="2" fill="#d6ece7">
    <rect x="216" y="446" width="54" height="24" rx="2"/>
    <rect x="286" y="452" width="54" height="24" rx="2"/>
    <rect x="356" y="440" width="46" height="24" rx="2"/>
  </g>
  <text x="243" y="462" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J5 radar</text>
  <text x="313" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J6 LCD</text>
  <text x="379" y="456" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J8 I2C</text>

  <!-- J1 + J7 right side -->
  <rect x="438" y="300" width="54" height="30" rx="2" fill="#d6ece7" stroke="#2f6f63" stroke-width="2"/>
  <text x="465" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J1 5V</text>
  <rect x="424" y="346" width="58" height="24" rx="2" fill="#d6ece7" stroke="#2f6f63" stroke-width="2"/>
  <text x="453" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#1f5049">J7 prog</text>

  <!-- protection cluster -->
  <rect x="392" y="248" width="40" height="26" rx="2" fill="#f6e2e2" stroke="#9c4444" stroke-width="1.5"/>
  <text x="412" y="265" text-anchor="middle" font-size="9" fill="#7d3434">F1/D1/Q1</text>

  <!-- legend -->
  <g font-size="11" fill="#4a4a4a">
    <rect x="60" y="556" width="14" height="12" fill="#d9e2ef" stroke="#3a5480" stroke-width="1.5"/>
    <text x="82" y="566">Active silicon</text>
    <rect x="200" y="556" width="14" height="12" fill="#d6ece7" stroke="#2f6f63" stroke-width="1.5"/>
    <text x="222" y="566">Connectors (rear-facing)</text>
    <rect x="400" y="556" width="14" height="12" fill="#f6e2e2" stroke="#9c4444" stroke-width="1.5"/>
    <text x="422" y="566">Power / protection</text>
  </g>
  <g font-size="11" fill="#4a4a4a">
    <rect x="60" y="580" width="14" height="12" fill="#eee9df" stroke="#7a7364" stroke-width="1.5"/>
    <text x="82" y="590">Bulk caps (tallest, ~11mm)</text>
    <rect x="280" y="580" width="14" height="12" fill="#f3dcc4" stroke="#9a6b2f" stroke-width="1.5"/>
    <text x="302" y="590">RF</text>
  </g>

  <text x="60" y="620" font-size="11" fill="#6b6b6b">Layer 2 solid ground, unbroken beneath U1, U2 and the SPI group. Stitch vias every 5mm along the perimeter.</text>
  <text x="60" y="638" font-size="11" fill="#6b6b6b">J6 and J1b (USB-C, not shown) are interior-variant only. J1a screw terminal shown in the exterior position.</text>
</svg>
